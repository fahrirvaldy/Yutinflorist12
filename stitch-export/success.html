<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 flex items-center justify-center p-4">
<!-- Success State Modal Container -->
<div class="bg-surface rounded-xl shadow-lg w-full max-w-md p-8 flex flex-col items-center text-center relative overflow-hidden">
<!-- Decorative background element -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-fixed rounded-full blur-3xl opacity-50 pointer-events-none"></div>
<!-- Success Icon with Pulse -->
<div class="relative flex items-center justify-center mb-6">
<div class="absolute inset-0 bg-primary-fixed rounded-full animate-pulse-fast opacity-50 scale-150"></div>
<div class="bg-primary text-on-primary rounded-full p-4 z-10 shadow-md">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Heading -->
<h2 class="font-title-md text-title-md text-primary mb-4">Pesanan Berhasil Diteruskan!</h2>
<!-- Sub-heading / Description -->
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-2">
                Sistem otomatis membuka aplikasi WhatsApp. Silakan klik 'Kirim' pada chat dengan Admin Yutin Florist untuk memproses pesanan Anda.
            </p>
<!-- Action Button -->
<button class="w-full flex items-center justify-center bg-primary text-on-primary font-label-md text-label-md rounded-lg py-3 px-6 hover:bg-primary-container transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                Selesai &amp; Kembali ke Katalog
            </button>
</div>
